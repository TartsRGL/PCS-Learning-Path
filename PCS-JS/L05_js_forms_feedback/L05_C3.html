<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Discovery — L05 C3</title>
</head>
<body>

  <header>
    <h1>Project Discovery</h1>
    <p>Průvodce pro pojmenování a ujasnění vašeho projektu.</p>
  </header>

  <main data-app="project-discovery" data-js="app-root">
    <section aria-labelledby="discovery-heading">
      <h2 id="discovery-heading">O čem je váš projekt?</h2>

      <form id="discovery-form" data-js="discovery-form" novalidate>

        <p id="form-feedback" data-js="form-feedback" aria-live="polite"></p>

        <fieldset>
          <legend>Základní informace</legend>

          <div>
            <label for="project-name">Název projektu</label>
            <input
              type="text"
              id="project-name"
              data-js="project-name"
              name="project-name"
              autocomplete="off"
              placeholder="Jak váš projekt pracovně nazýváte?"
              aria-describedby="project-name-error"
            >
            <p id="project-name-error" data-js="project-name-error"></p>
          </div>

          <div>
            <label for="project-goal">Hlavní cíl projektu</label>
            <textarea
              id="project-goal"
              data-js="project-goal"
              name="project-goal"
              rows="3"
              placeholder="Co má projekt řešit nebo umožnit?"
              aria-describedby="project-goal-error"
            ></textarea>
            <p id="project-goal-error" data-js="project-goal-error"></p>
          </div>

        </fieldset>

        <fieldset>
          <legend>Kontext a uživatelé</legend>

          <div>
            <label for="target-user">Pro koho je projekt určen?</label>
            <input
              type="text"
              id="target-user"
              data-js="target-user"
              name="target-user"
              placeholder="Kdo bude projekt používat?"
              aria-describedby="target-user-error"
            >
            <p id="target-user-error" data-js="target-user-error"></p>
          </div>

          <div>
            <label for="core-problem">Jaký problém řeší?</label>
            <textarea
              id="core-problem"
              data-js="core-problem"
              name="core-problem"
              rows="3"
              placeholder="Popište situaci, kterou projekt zlepšuje."
              aria-describedby="core-problem-error"
            ></textarea>
            <p id="core-problem-error" data-js="core-problem-error"></p>
          </div>

        </fieldset>

        <button type="submit" data-js="submit-button">Uložit odpovědi</button>

      </form>
    </section>
  </main>

  <footer>
    <p>PCS-JS · L05 — Forms & Feedback · Commit 3</p>
  </footer>

  <!-- Commit 1 – Establish accessible feedback element contract -->
  <!-- Commit 2 – Validate discovery form state model on submission -->
  <!-- Commit 3 – Render validation feedback and error states -->
  <script src="L05_C3.js" defer></script>

</body>
</html>
